<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell an Item - UniLoop</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">UniLoop</div>

        <nav>
            <a href="/">Home</a>
            <a href="/items">Browse</a>
            <a href="/sell.html">Sell</a>
            <a href="/requests">Requests</a>
            <a href="#">Login</a>
        </nav>

    </header>


    <main class="sell-page">

    <!-- My Listings -->
    <div class="my-listings">

        <h1>My Listings</h1>

        <p>Your items listed on UniLoop.</p>

        <div class="my-listing-container">

            <div class="my-listing-card"
                 th:each="item : ${myListings}">

                <div class="my-listing-image">

                    <img th:if="${item.imagePath != null and !item.imagePath.isEmpty()}"
                         th:src="${item.imagePath}"
                         alt="Item image">

                    <span th:unless="${item.imagePath != null and !item.imagePath.isEmpty()}">
                        📦
                    </span>

                </div>

                <div class="my-listing-info">

                    <h3 th:text="${item.itemName}">
                        Item Name
                    </h3>

                    <p th:text="${item.condition}">
                        Condition
                    </p>

                    <strong th:text="'₹' + ${item.price}">
                        ₹0
                    </strong>

                    <p>
                        Status:
                        <span th:text="${item.itemStatus}">
                            AVAILABLE
                        </span>
                    </p>

                </div>

            </div>

            <!-- Message when there are no listings -->
            <div th:if="${#lists.isEmpty(myListings)}"
                 class="no-listings">

                <p>You haven't listed any items yet.</p>

            </div>

        </div>

    </div>


    <!-- Sell Form -->
    <div class="sell-form">

        <h1>List an Item</h1>

        <p>Give your item a new home on campus.</p>

        <form action="/sell"
              method="post"
              enctype="multipart/form-data">

            <!-- Temporary seller ID -->
            <input type="hidden"
                   name="sellerId"
                   value="1">

            <label for="categoryId">Category</label>

            <select id="categoryId"
                    name="categoryId"
                    required>

                <option value="">
                    Select a category
                </option>

                <option value="1">Books</option>
                <option value="2">Electronics</option>
                <option value="3">Stationery</option>
                <option value="4">Clothing</option>
                <option value="5">Hostel Items</option>
                <option value="6">Sports & Fitness</option>
                <option value="7">Other</option>

            </select>


            <label for="itemName">Item Name</label>

            <input
                type="text"
                id="itemName"
                name="itemName"
                placeholder="e.g. Engineering Mathematics Book"
                required
            >


            <label for="condition">Condition</label>

            <select id="condition"
                    name="condition"
                    required>

                <option value="">
                    Select condition
                </option>

                <option value="New">New</option>
                <option value="Like New">Like New</option>
                <option value="Good">Good</option>
                <option value="Fair">Fair</option>

            </select>


            <label for="price">Price</label>

            <input
                type="number"
                id="price"
                name="price"
                placeholder="Enter price"
                min="0"
                required
            >


            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Tell students something about your item..."
            ></textarea>


            <label for="image">Item Image</label>

            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
            >


            <label for="listingType">Listing Type</label>

            <select id="listingType"
                    name="listingType"
                    required>

                <option value="">
                    Select listing type
                </option>

                <option value="SELL">Sell</option>
                <option value="DONATE">Donate</option>
                <option value="EXCHANGE">Exchange</option>

            </select>


            <button type="submit"
                    class="submit-button">

                List Item

            </button>

        </form>

    </div>

</main>

</body>
</html>
