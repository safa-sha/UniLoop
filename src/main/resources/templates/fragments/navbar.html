<header class="navbar site-navbar" xmlns:th="http://www.thymeleaf.org" th:fragment="navbar(currentPage)">
    <a class="logo" href="/" aria-label="UniLoop home">
        <span class="logo-icon"></span>
        <span>UniLoop</span>
    </a>
    <nav class="site-navbar-links" aria-label="Main navigation">
        <a href="/" th:classappend="${currentPage == 'home'} ? ' nav-current' : ''">Home</a>
        <a href="/items" th:classappend="${currentPage == 'browse'} ? ' nav-current' : ''">Browse</a>
        <a href="/sell" th:classappend="${currentPage == 'sell'} ? ' nav-current' : ''">Sell</a>
    </nav>
    <div class="site-navbar-actions">
        <a href="/list-item" class="navbar-cta">Sell an Item <span aria-hidden="true">↗</span></a>
        <span class="navbar-greeting"
              th:if="${session != null and session.authenticatedUserId != null and session.authenticatedUserName != null and !#strings.isEmpty(#strings.trim(session.authenticatedUserName)) and #strings.toLowerCase(#strings.trim(session.authenticatedUserName)) != 'null'}"
              th:text="${'Hi, ' + #strings.substringBefore(#strings.trim(session.authenticatedUserName), ' ')}">Hi</span>
        <details class="navbar-profile-menu">
            <summary class="navbar-profile-toggle" aria-label="Open account menu" title="Account">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.7-3.6 3.2-5.5 7-5.5s6.3 1.9 7 5.5"></path></svg>
            </summary>
            <div class="navbar-profile-dropdown" th:if="${session != null and session.authenticatedUserId != null}">
                <a href="/profile">My Profile</a>
                <a href="/settings">Settings</a>
                <a href="/my-requests">My Requests</a>
                <a href="/admin" th:if="${activeAdmin == true}">Admin Dashboard</a>
                <form action="/logout" method="post" class="navbar-logout-form"
                      data-confirm-title="Log out of UniLoop?"
                      data-confirm-message="Are you sure you want to log out of your account?"
                      data-confirm-text="Log Out">
                    <button type="submit">Log Out</button>
                </form>
            </div>
            <div class="navbar-profile-dropdown" th:if="${session == null or session.authenticatedUserId == null}">
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            </div>
        </details>
    </div>
    <div class="success-notification success-notification-floating" role="status" aria-live="polite"
         th:if="${session != null and session.loginSuccessMessage != null}"
         data-dismiss-url="/dismiss-login-notice">
        <span class="success-notification-icon" aria-hidden="true">✓</span>
        <span class="success-notification-text" th:text="${session.loginSuccessMessage}">Welcome back!</span>
        <button class="success-notification-dismiss" type="button" aria-label="Dismiss success message">×</button>
    </div>
    <script src="/js/confirmation-modal.js" defer></script>
    <script src="/js/success-notification.js" defer></script>
</header>
