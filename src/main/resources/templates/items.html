<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Browse Items - UniLoop</title>

    <link rel="stylesheet"
          href="/css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        UniLoop
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/items">Browse</a>
        <a href="/sell">Sell</a>
        <a href="/requests">Requests</a>
        <a href="#">Login</a>
    </nav>

</header>


<main class="items">

    <h1>
        Browse Items
    </h1>

    <p>
        Items available in your campus marketplace.
    </p>


    <div class="category-filter">

        <a href="/items">All</a>

        <a href="/items?category=1">
            Books
        </a>

        <a href="/items?category=2">
            Electronics
        </a>

        <a href="/items?category=3">
            Stationery
        </a>

        <a href="/items?category=4">
            Clothing
        </a>

        <a href="/items?category=5">
            Hostel Items
        </a>

        <a href="/items?category=6">
            Sports
        </a>

        <a href="/items?category=7">
            Other
        </a>

    </div>


    <div class="item-container">


        <!-- ============================== -->
        <!-- ITEM CARD -->
        <!-- ============================== -->

        <div class="item-card"
             th:each="item : ${items}"
             th:onclick="'window.location.href=\'/item?id=' + ${item.itemId} + '\''">


            <!-- ITEM IMAGE -->

            <div class="item-image">

                <img th:if="${item.imagePath != null and !item.imagePath.isEmpty()}"
                     th:src="${item.imagePath}"
                     alt="Item image">

                <span th:unless="${item.imagePath != null and !item.imagePath.isEmpty()}">
                    📦
                </span>

            </div>


            <!-- ITEM NAME -->

            <h3 th:text="${item.itemName}">
                Item Name
            </h3>


            <!-- CONDITION -->

            <p th:text="${item.condition}">
                Condition
            </p>


            <!-- PRICE -->

            <strong th:text="'₹' + ${item.price}">
                ₹0
            </strong>



            <!-- ============================== -->
            <!-- NO REQUEST YET -->
            <!-- ============================== -->

            <div th:if="${item.requestStatus == null}">

                <form action="/request"
                      method="post"
                      onclick="event.stopPropagation()">

                    <input type="hidden"
                           name="buyerId"
                           value="2">

                    <input type="hidden"
                           name="itemId"
                           th:value="${item.itemId}">

                    <input type="hidden"
                           name="source"
                           value="items">

                    <button type="submit"
                            class="submit-button">

                        Request Item

                    </button>

                </form>

            </div>



            <!-- ============================== -->
            <!-- REQUEST PENDING -->
            <!-- ============================== -->

            <div th:if="${item.requestStatus == 'PENDING'}">

                <p>
                    ✓ Request Sent
                </p>


                <form action="/cancel-request"
                      method="post"
                      onclick="event.stopPropagation()">

                    <input type="hidden"
                           name="buyerId"
                           value="2">

                    <input type="hidden"
                           name="requestId"
                           th:value="${item.requestId}">

                    <input type="hidden"
                           name="source"
                           value="items">

                    <button type="submit"
                            class="submit-button">

                        Cancel Request

                    </button>

                </form>

            </div>



            <!-- ============================== -->
            <!-- REQUEST ACCEPTED -->
            <!-- ============================== -->

            <div th:if="${item.requestStatus == 'ACCEPTED'}">

                <p>
                    ✓ Request Accepted
                </p>

            </div>



            <!-- ============================== -->
            <!-- REQUEST REJECTED -->
            <!-- ============================== -->

            <div th:if="${item.requestStatus == 'REJECTED'}">

                <p>
                    Request Rejected
                </p>


                <form action="/request"
                      method="post"
                      onclick="event.stopPropagation()">

                    <input type="hidden"
                           name="buyerId"
                           value="2">

                    <input type="hidden"
                           name="itemId"
                           th:value="${item.itemId}">

                    <input type="hidden"
                           name="source"
                           value="items">

                    <button type="submit"
                            class="submit-button">

                        Request Again

                    </button>

                </form>

            </div>



            <!-- ============================== -->
            <!-- REQUEST CANCELLED -->
            <!-- ============================== -->

            <div th:if="${item.requestStatus == 'CANCELLED'}">

                <p>
                    Request Cancelled
                </p>


                <form action="/request"
                      method="post"
                      onclick="event.stopPropagation()">

                    <input type="hidden"
                           name="buyerId"
                           value="2">

                    <input type="hidden"
                           name="itemId"
                           th:value="${item.itemId}">

                    <input type="hidden"
                           name="source"
                           value="items">

                    <button type="submit"
                            class="submit-button">

                        Request Again

                    </button>

                </form>

            </div>


        </div>

    </div>

</main>

</body>
</html>
