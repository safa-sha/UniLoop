
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>List an Item - UniLoop</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        UniLoop
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/items">Browse</a>
        <a href="/sell">Sell</a>
        <a href="#">Login</a>
    </nav>

</header>


<main class="sell-form-page">

    <div class="sell-form">

        <a href="/sell" class="back-to-listings">
            ← Back to My Listings
        </a>


        <div class="sell-heading">

            <div>

                <h1>List an Item</h1>

                <p>Give your item a new home on campus.</p>

            </div>

        </div>


        <form action="/sell"
              method="post"
              enctype="multipart/form-data"
              onsubmit="return confirm('Are you sure you want to list this item?');">


            <input type="hidden"
                   name="sellerId"
                   value="1">


            <label for="categoryId">
                Category
            </label>

            <select id="categoryId"
                    name="categoryId"
                    required>

                <option value="">
                    Select a category
                </option>

                <option value="1"
                        th:selected="${item != null and item.categoryId == 1}">
                    Books
                </option>

                <option value="2"
                        th:selected="${item != null and item.categoryId == 2}">
                    Electronics
                </option>

                <option value="3"
                        th:selected="${item != null and item.categoryId == 3}">
                    Stationery
                </option>

                <option value="4"
                        th:selected="${item != null and item.categoryId == 4}">
                    Clothing
                </option>

                <option value="5"
                        th:selected="${item != null and item.categoryId == 5}">
                    Hostel Items
                </option>

                <option value="6"
                        th:selected="${item != null and item.categoryId == 6}">
                    Sports & Fitness
                </option>

                <option value="7"
                        th:selected="${item != null and item.categoryId == 7}">
                    Other
                </option>

            </select>


            <label for="itemName">
                Item Name
            </label>

            <input type="text"
                   id="itemName"
                   name="itemName"
                   placeholder="e.g. Engineering Mathematics Book"
                   th:value="${item != null ? item.itemName : ''}"
                   required>


            <label for="condition">
                Condition
            </label>

            <select id="condition"
                    name="condition"
                    required>

                <option value="">
                    Select condition
                </option>

                <option value="New"
                        th:selected="${item != null and item.condition == 'New'}">
                    New
                </option>

                <option value="Like New"
                        th:selected="${item != null and item.condition == 'Like New'}">
                    Like New
                </option>

                <option value="Good"
                        th:selected="${item != null and item.condition == 'Good'}">
                    Good
                </option>

                <option value="Fair"
                        th:selected="${item != null and item.condition == 'Fair'}">
                    Fair
                </option>

            </select>


            <label for="listingType">
                Listing Type
            </label>

            <select id="listingType"
                    name="listingType"
                    required>

                <option value="">
                    Select listing type
                </option>

                <option value="SELL"
                        th:selected="${item != null and item.listingType == 'SELL'}">
                    Sell
                </option>

                <option value="DONATE"
                        th:selected="${item != null and item.listingType == 'DONATE'}">
                    Donate
                </option>

            </select>


            <div id="price-field">

                <label for="price">
                    Price
                </label>

                <input type="number"
                       id="price"
                       name="price"
                       placeholder="Enter price"
                       min="0"
                       th:value="${item != null ? item.price : ''}">

            </div>


            <label for="description">
                Description
            </label>

            <textarea id="description"
                      name="description"
                      rows="5"
                      placeholder="Tell students something about your item..."
                      th:text="${item != null ? item.description : ''}"></textarea>


            <label for="image">
                Item Image
            </label>

            <input type="file"
                   id="image"
                   name="image"
                   accept="image/*">


            <button type="submit"
                    class="submit-button">

                List Item

            </button>

        </form>

    </div>

</main>



<script>

    const listingType =
        document.getElementById("listingType");

    const priceField =
        document.getElementById("price-field");

    const priceInput =
        document.getElementById("price");


    function updatePriceField() {

        if (listingType.value === "DONATE") {

            priceField.style.display = "none";

            priceInput.required = false;
            priceInput.value = "";

        } else {

            priceField.style.display = "block";

            if (listingType.value === "SELL") {
                priceInput.required = true;
            } else {
                priceInput.required = false;
            }

        }

    }


    listingType.addEventListener("change", updatePriceField);


    // Apply the correct state when the page loads
    updatePriceField();

</script>


</body>

</html>
