<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniLoop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page registration-page">
<header th:replace="~{fragments/navbar :: navbar('')}"></header>
<main class="registration-main">
    <section class="registration-card" aria-labelledby="login-title">
        <p class="registration-eyebrow">WELCOME BACK</p>
        <h1 id="login-title">Login to UniLoop</h1>
        <p class="registration-intro">Sign in with your college account.</p>
        <div class="registration-message registration-error" role="alert"
             th:if="${loginError != null}" th:text="${loginError}"></div>
        <div class="registration-message" role="status"
             th:if="${loginNotice != null}" th:text="${loginNotice}"></div>
        <form class="registration-form" action="/login" method="post">
            <input type="hidden" name="returnTo" th:value="${returnTo}">
            <label for="email">College email</label>
            <input id="email" name="email" type="email" maxlength="100"
                   autocomplete="username" required th:value="${email}">
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
            <button class="submit-button registration-submit" type="submit">Login</button>
        </form>
        <p class="registration-login-link">New to UniLoop? <a href="/register">Register</a></p>
    </section>
</main>
<script>
    window.addEventListener("pageshow", function (event) {
        const navigation = performance.getEntriesByType("navigation")[0];
        const restoredNavigation = event.persisted
            || (navigation && (navigation.type === "reload" || navigation.type === "back_forward"));

        const password = document.getElementById("password");
        if (password) password.value = "";
        if (!restoredNavigation) return;

        const form = document.querySelector(".registration-form");
        if (form) form.reset();

        ["email", "password"].forEach(function (fieldId) {
            const field = document.getElementById(fieldId);
            if (field) field.value = "";
        });

        document.querySelectorAll(".registration-message").forEach(function (message) {
            message.remove();
        });
    });
</script>
</body>
</html>
